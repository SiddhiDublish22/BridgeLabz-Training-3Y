<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q8 – Photo Gallery</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f9f9f9; padding: 30px; }

    h1 { text-align: center; margin-bottom: 20px; }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    figure {
      position: relative;
      overflow: hidden;
      border-radius: 8px;
    }

    img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    figure:hover img {
      transform: scale(1.1);
    }

    figcaption {
      text-align: center;
      padding: 8px;
      background: #fff;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Photo Gallery</h1>

  <div class="gallery">
    <figure>
      <img src="https://via.placeholder.com/300x200" alt="Image 1">
      <figcaption>Mountain</figcaption>
    </figure>
    <figure>
      <img src="https://via.placeholder.com/300x200" alt="Image 2">
      <figcaption>Beach</figcaption>
    </figure>
    <figure>
      <img src="https://via.placeholder.com/300x200" alt="Image 3">
      <figcaption>Forest</figcaption>
    </figure>
    <figure>
      <img src="https://via.placeholder.com/300x200" alt="Image 4">
      <figcaption>City</figcaption>
    </figure>
  </div>
</body>
</html>
