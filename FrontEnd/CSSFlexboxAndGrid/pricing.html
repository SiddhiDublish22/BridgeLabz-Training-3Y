<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q5 – Pricing Section</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .pricing {
      display: flex;
      gap: 20px;
      animation: fadeIn 1s ease-in;
      flex-wrap: wrap;
      justify-content: center;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 10px;
      text-align: center;
      width: 250px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      transition: transform 0.3s;
    }

    .card:hover { transform: translateY(-10px); }

    .featured {
      background: #0078ff;
      color: white;
      transform: scale(1.05);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 750px) {
      .pricing { flex-direction: column; align-items: center; }
    }
  </style>
</head>
<body>
  <div class="pricing">
    <div class="card"><h2>Basic</h2><p>₹499/month</p></div>
    <div class="card featured"><h2>Standard</h2><p>₹999/month</p></div>
    <div class="card"><h2>Premium</h2><p>₹1499/month</p></div>
  </div>
</body>
</html>
