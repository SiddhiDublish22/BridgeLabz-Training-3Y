<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q4 – Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }

    .grid {
      display: grid;
      grid-template-areas:
        "header header"
        "sidebar main";
      grid-template-columns: 200px 1fr;
      grid-template-rows: 60px 1fr;
      height: 100vh;
    }

    header {
      grid-area: header;
      background: #0078ff;
      color: #fff;
      display: flex;
      align-items: center;
      padding: 0 20px;
      font-size: 1.2rem;
    }

    aside {
      grid-area: sidebar;
      background: #f4f4f4;
      padding: 20px;
    }

    aside ul { list-style: none; }
    aside li { margin: 15px 0; }

    main {
      grid-area: main;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-gap: 20px;
    }

    .box {
      background: #fff;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .box:hover {
      transform: scale(1.03);
      box-shadow: 0 5px 10px rgba(0,0,0,0.15);
    }

    .wide { grid-column: span 2; }
  </style>
</head>
<body>
  <div class="grid">
    <header>Dashboard</header>
    <aside>
      <ul>
        <li>Home</li>
        <li>Reports</li>
        <li>Analytics</li>
        <li>Settings</li>
      </ul>
    </aside>
    <main>
      <div class="box">Box 1</div>
      <div class="box">Box 2</div>
      <div class="box wide">Wide Box (spans 2 columns)</div>
      <div class="box">Box 4</div>
    </main>
  </div>
</body>
</html>
