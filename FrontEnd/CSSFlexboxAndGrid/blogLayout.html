<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q6 – Blog Layout</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }

    .grid {
      display: grid;
      grid-template-areas:
        "header header"
        "sidebar main"
        "footer footer";
      grid-template-columns: 250px 1fr;
      gap: 20px;
      padding: 20px;
    }

    header { grid-area: header; background: #0078ff; color: white; padding: 15px; }
    sidebar { grid-area: sidebar; background: #f5f5f5; padding: 20px; }
    main { grid-area: main; display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
    footer { grid-area: footer; background: #0078ff; color: white; text-align: center; padding: 15px; }

    article {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    @media (max-width: 800px) {
      .grid {
        grid-template-areas:
          "header"
          "main"
          "sidebar"
          "footer";
        grid-template-columns: 1fr;
      }
      main { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="grid">
    <header><h1>My Blog</h1></header>
    <sidebar>
      <h3>Categories</h3>
      <ul>
        <li>Tech</li><li>Design</li><li>Travel</li><li>Lifestyle</li>
      </ul>
    </sidebar>
    <main>
      <article><h2>Blog Post 1</h2><p>Intro to CSS Grid Layout.</p></article>
      <article><h2>Blog Post 2</h2><p>Responsive Design Principles.</p></article>
    </main>
    <footer>Contact: hello@blog.com</footer>
  </div>
</body>
</html>
