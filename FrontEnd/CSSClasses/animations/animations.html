<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animation Demonstration</title>
    <link rel="stylesheet" href="q6-animations.css">
</head>

<body>

<header>
    <h1>CSS Animation Demonstration</h1>
</header>

<main>
    <!-- Flexbox to center items -->
    <section class="animation-wrapper">

        <!-- Moving Box -->
        <div class="anim-box"></div>

        <!-- Bouncing Ball -->
        <div class="ball"></div>

        <!-- Color Changing Text -->
        <h2 class="color-change">Color Changing Text</h2>

    </section>
</main>

<footer>
    <p>Animations using @keyframes • delay • iteration • direction</p>
</footer>

</body>
</html>
