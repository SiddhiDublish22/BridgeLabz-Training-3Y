<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Components Page</title>
    <link rel="stylesheet" href="q7-ui-components.css">
</head>

<body>

<header>
    <h1>User Interface Components</h1>
</header>

<main>

    <!-- Card-like container using Flexbox -->
    <section class="ui-card">

        <!-- Search Bar -->
        <div class="search-wrapper">
            <input type="text" placeholder="Search..." class="search-input">
            <button class="btn search-btn">Search</button>
        </div>

        <!-- Buttons -->
        <div class="button-row">
            <button class="btn primary">Primary</button>
            <button class="btn secondary">Secondary</button>
        </div>

        <!-- Dropdown Menu -->
        <div class="dropdown-wrapper">
            <label for="menu">Select Option:</label>
            <select id="menu" class="dropdown">
                <option>Option 1</option>
                <option>Option 2</option>
                <option>Option 3</option>
            </select>
        </div>

    </section>

</main>

<footer>
    <p>UI Components • Flexbox • Focus & Hover Effects</p>
</footer>

</body>
</html>
