<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini UI Layout</title>
    <link rel="stylesheet" href="miniUI.css">
</head>
<body>

<header class="main-header">
    <h1>Mini User Interface</h1>
</header>

<main class="card">
    <img src="https://via.placeholder.com/120" alt="Sample">

    <form>
        <label>Name:</label>
        <input type="text" placeholder="Enter your name">

        <label>Email:</label>
        <input type="email" placeholder="Enter email">

        <button class="primary">Submit</button>
        <button class="secondary" type="reset">Reset</button>
    </form>
</main>

<footer class="main-footer">
    <p>© 2025 Mini UI Layout</p>
</footer>

</body>
</html>
