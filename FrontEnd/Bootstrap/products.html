<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Catalog</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
/* Product catalog CSS */
.product-card:hover {
    transform: translateY(-5px);
    transition: 0.3s;
}
</style>
</head>

<body>

<header class="bg-dark text-white text-center p-3">
    <h1 class="fw-bold">Our Products</h1>
</header>

<main class="container my-5">
    <div class="row g-4">

        <div class="col-12 col-sm-6 col-md-3">
            <div class="card shadow-sm product-card">
                <img src="https://source.unsplash.com/300x200/?gadget" class="card-img-top">
                <div class="card-body text-center">
                    <h5 class="card-title">Product A</h5>
                    <p class="card-text">$49.99</p>
                    <button class="btn btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-md-3">
            <div class="card shadow-sm product-card">
                <img src="https://source.unsplash.com/300x200/?electronics" class="card-img-top">
                <div class="card-body text-center">
                    <h5>Product B</h5>
                    <p>$79.99</p>
                    <button class="btn btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-md-3">
            <div class="card shadow-sm product-card">
                <img src="https://source.unsplash.com/300x200/?device" class="card-img-top">
                <div class="card-body text-center">
                    <h5>Product C</h5>
                    <p>$99.99</p>
                    <button class="btn btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-md-3">
            <div class="card shadow-sm product-card">
                <img src="https://source.unsplash.com/300x200/?tech" class="card-img-top">
                <div class="card-body text-center">
                    <h5>Product D</h5>
                    <p>$59.99</p>
                    <button class="btn btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>

    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
