<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Tracker</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
/* Task tracker CSS */
.badge-high { background-color: #dc3545; }
.badge-medium { background-color: #ffc107; }
.badge-low { background-color: #198754; }
</style>
</head>

<body>

<header class="bg-dark text-white text-center p-3">
    <h1>Task Tracker <span class="badge bg-light text-dark">5 Pending</span></h1>
</header>

<main class="container my-4">
    <ul class="list-group">
        <li class="list-group-item d-flex justify-content-between align-items-center">
            Finish project report
            <span class="badge badge-high text-white rounded-pill">High</span>
        </li>
        <li class="list-group-item d-flex justify-content-between align-items-center">
            Update portfolio
            <span class="badge badge-medium text-white rounded-pill">Medium</span>
        </li>
        <li class="list-group-item d-flex justify-content-between align-items-center">
            Buy groceries
            <span class="badge badge-low text-white rounded-pill">Low</span>
        </li>
    </ul>

    <div class="text-center mt-3">
        <button class="btn btn-success">
            Completed <span class="badge bg-light text-dark">2</span>
        </button>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
