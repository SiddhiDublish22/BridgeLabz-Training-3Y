<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog Pagination</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
/* Pagination CSS */
</style>
</head>

<body>

<header class="bg-primary text-white text-center p-3">
    <h1>Blog Posts</h1>
</header>

<main class="container my-5">

    <div class="row g-4">
        <div class="col-md-6">
            <div class="card h-100 shadow">
                <img src="https://source.unsplash.com/600x300/?blog" class="card-img-top">
                <div class="card-body">
                    <h5 class="card-title fw-bold">Blog Post 1</h5>
                    <p class="card-text">Brief description of blog post 1.</p>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card h-100 shadow">
                <img src="https://source.unsplash.com/600x300/?writing" class="card-img-top">
                <div class="card-body">
                    <h5 class="card-title fw-bold">Blog Post 2</h5>
                    <p class="card-text">Brief description of blog post 2.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Pagination -->
    <nav class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item"><a class="page-link" href="#">Previous</a></li>
            <li class="page-item"><a class="page-link" href="#">1</a></li>
            <li class="page-item"><a class="page-link" href="#">2</a></li>
            <li class="page-item"><a class="page-link" href="#">Next</a></li>
        </ul>
    </nav>

    <!-- Pager -->
    <div class="d-flex justify-content-between mt-3">
        <button class="btn btn-outline-secondary">Older Posts</button>
        <button class="btn btn-outline-secondary">Newer Posts</button>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
