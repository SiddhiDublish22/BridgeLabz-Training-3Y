<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Custom Blog</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">

<style>
/* Custom Theme */
:root {
    --bs-primary: #ff6b6b; /* override primary color */
    --bs-font-sans-serif: 'Roboto', sans-serif;
}

body {
    font-family: var(--bs-font-sans-serif);
    background: #f8f9fa;
}

.card:hover {
    transform: translateY(-5px);
    transition: 0.3s;
}
</style>
</head>

<body>

<header class="bg-primary text-white text-center p-4">
    <h1 class="fw-bold">My Blog</h1>
</header>

<main class="container my-5">
    <div class="row g-4">
        <div class="col-md-6">
            <div class="card h-100 shadow">
                <img src="https://source.unsplash.com/600x300/?coding" class="card-img-top" alt="Post 1">
                <div class="card-body">
                    <h5 class="card-title fw-bold">Post Title 1</h5>
                    <p class="card-text">Short description of the blog post content goes here.</p>
                    <a href="#" class="btn btn-primary">Read More</a>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card h-100 shadow">
                <img src="https://source.unsplash.com/600x300/?tech" class="card-img-top" alt="Post 2">
                <div class="card-body">
                    <h5 class="card-title fw-bold">Post Title 2</h5>
                    <p class="card-text">Short description of another blog post content.</p>
                    <a href="#" class="btn btn-primary">Read More</a>
                </div>
            </div>
        </div>
    </div>
</main>

<footer class="bg-dark text-white text-center p-3">
    © 2025 My Blog. All rights reserved.
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
