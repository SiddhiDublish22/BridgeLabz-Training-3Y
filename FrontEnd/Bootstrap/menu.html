<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurant Menu</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
/* Menu page CSS */
.special-img {
    max-width: 100%;
    border-radius: 10px;
}
</style>
</head>

<body>

<header class="bg-dark text-white text-center p-3">
    <h1 class="fw-bold">Today's Menu</h1>
</header>

<main class="container mt-4">

    <table class="table table-bordered text-center">
        <thead class="table-dark">
            <tr>
                <th>Category</th>
                <th>Dish</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Main Course</td>
                <td>Grilled Chicken</td>
                <td>$12</td>
            </tr>
            <tr>
                <td>Snacks</td>
                <td>French Fries</td>
                <td>$5</td>
            </tr>
            <tr>
                <td>Dessert</td>
                <td>Chocolate Cake</td>
                <td>$7</td>
            </tr>
        </tbody>
    </table>

    <h4>Chef’s Specials</h4>
    <ul class="list-group mb-4">
        <li class="list-group-item">Spicy Garlic Noodles</li>
        <li class="list-group-item">Honey Glazed Salmon</li>
        <li class="list-group-item">Mango Delight Dessert</li>
    </ul>

    <div class="text-center">
        <img src="https://source.unsplash.com/400x250/?food" class="special-img" alt="Special Dish">
        <p class="mt-2 lead">Chef’s Special of the Day</p>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
