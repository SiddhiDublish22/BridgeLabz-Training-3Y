<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pricing Plans</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
/* Pricing plan CSS */
.card:hover {
    transform: translateY(-6px);
    transition: 0.3s;
}
.pro-plan {
    background-color: #0d6efd;
    color: #fff;
}
</style>
</head>

<body>

<header class="bg-dark text-white text-center p-3">
    <h1>Choose Your Plan</h1>
</header>

<main class="container my-5">
    <div class="row g-4">

        <div class="col-md-4">
            <div class="card p-4 text-center">
                <h4 class="fw-bold">Basic</h4>
                <h5 class="my-3">$9/mo</h5>
                <ul class="list-unstyled">
                    <li>5 Projects</li>
                    <li>10 GB Storage</li>
                    <li>Email Support</li>
                </ul>
                <button class="btn btn-outline-primary">Select</button>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-4 text-center pro-plan">
                <h4 class="fw-bold">Pro</h4>
                <h5 class="my-3">$29/mo</h5>
                <ul class="list-unstyled">
                    <li>50 Projects</li>
                    <li>100 GB Storage</li>
                    <li>Priority Support</li>
                </ul>
                <button class="btn btn-light">Select</button>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-4 text-center">
                <h4 class="fw-bold">Enterprise</h4>
                <h5 class="my-3">$99/mo</h5>
                <ul class="list-unstyled">
                    <li>Unlimited Projects</li>
                    <li>1 TB Storage</li>
                    <li>24/7 Support</li>
                </ul>
                <button class="btn btn-outline-primary">Select</button>
            </div>
        </div>

    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
