<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal Portfolio</title>

<!-- Bootstrap 5 CDN -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
/* Portfolio CSS */

/* Light background for portfolio page */
body {
    background-color: #f8f9fa;
}

/* Profile image styling */
.profile-img {
    width: 200px;
    height: 200px;
    object-fit: cover;
}
</style>
</head>

<body>

<header class="bg-light text-dark text-center p-5">
    <h1 class="fw-bold">Siddhi Dublish</h1>
    <p class="lead">Frontend Developer & Designer</p>
</header>

<main class="container text-center mt-5">

    <!-- Profile Image -->
    <img src="https://source.unsplash.com/200x200/?person" class="img-fluid rounded-circle profile-img mb-4" alt="Profile">

    <!-- Buttons -->
    <div class="mb-4">
        <button class="btn btn-primary me-2">Hire Me</button>
        <button class="btn btn-outline-dark">Download CV</button>
    </div>

    <!-- Contact Form -->
    <section>
        <h3>Contact Me</h3>
        <form class="mt-3">
            <input type="text" class="form-control mb-3" placeholder="Your Name">
            <input type="email" class="form-control mb-3" placeholder="Your Email">
            <textarea class="form-control mb-3" rows="4" placeholder="Message"></textarea>
            <button class="btn btn-dark w-100">Send</button>
        </form>
    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
