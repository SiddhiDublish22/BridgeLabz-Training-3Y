<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Agency</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
/* Travel page CSS */
.progress {
    height: 25px;
}
</style>
</head>

<body>

<header class="bg-primary text-white text-center p-3">
    <h1>Explore the World</h1>
</header>

<main class="container my-4">

    <!-- Carousel -->
    <div id="travelCarousel" class="carousel slide mb-5" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active" data-bs-interval="3000">
                <img src="https://source.unsplash.com/1200x400/?paris" class="d-block w-100" alt="Paris">
                <div class="carousel-caption d-none d-md-block">
                    <h5>Paris, France</h5>
                    <p>The city of love and lights</p>
                </div>
            </div>
            <div class="carousel-item" data-bs-interval="3000">
                <img src="https://source.unsplash.com/1200x400/?maldives" class="d-block w-100" alt="Maldives">
                <div class="carousel-caption d-none d-md-block">
                    <h5>Maldives</h5>
                    <p>Tropical paradise for relaxation</p>
                </div>
            </div>
            <div class="carousel-item" data-bs-interval="3000">
                <img src="https://source.unsplash.com/1200x400/?newyork" class="d-block w-100" alt="New York">
                <div class="carousel-caption d-none d-md-block">
                    <h5>New York, USA</h5>
                    <p>The city that never sleeps</p>
                </div>
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#travelCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#travelCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>

    <!-- Progress bar -->
    <h5>Booking Completion</h5>
    <div class="progress mb-5">
        <div class="progress-bar progress-bar-striped progress-bar-animated" style="width:70%">70%</div>
    </div>

</main>

<footer class="bg-dark text-white text-center p-3">
    Contact us: info@travelagency.com | +91 98765 43210
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
