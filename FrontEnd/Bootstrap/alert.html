<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
/* Alerts dashboard CSS */
.summary-well {
    border: 1px solid #dee2e6;
    padding: 20px;
    border-radius: 8px;
    background-color: #f8f9fa;
}
</style>
</head>

<body>

<header class="bg-primary text-white text-center p-3">
    <h1>User Notifications</h1>
</header>

<main class="container my-4">

    <!-- Alerts -->
    <div class="card p-3 mb-4">
        <div class="alert alert-success alert-dismissible fade show" role="alert">
            New message received!
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="alert alert-info" role="alert">
            Tip: Check your profile settings regularly.
        </div>

        <div class="alert alert-danger" role="alert">
            Warning: Password will expire soon!
        </div>
    </div>

    <!-- Summary Well -->
    <div class="summary-well text-center">
        <h5>Total Notifications: 7</h5>
        <p>3 messages, 2 tips, 2 warnings</p>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
