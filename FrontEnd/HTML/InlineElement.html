<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>multiple inline element</title>
</head>
<body>
    <p>
  Learning web development is <strong>very important</strong>. 
  It helps you <em>create amazing websites</em>. 
  You can even <mark>highlight key points</mark> 
  or use <small>small text for details</small>.<br>
  Inline formatting makes text more meaningful.
</p>

</body>
</html>
