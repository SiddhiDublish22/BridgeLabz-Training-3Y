<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Q6 - Registration (Axios)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <style>
    body{font-family:Arial,Helvetica,sans-serif; padding:20px; max-width:550px; margin:auto}
    form{display:grid; gap:10px}
    input{padding:10px; font-size:14px}
    .error{color:#b00020}
    .success{color:#117a11}
  </style>
</head>
<body>
  <h2>User Registration</h2>
  <div id="msg"></div>
  <form id="regForm">
    <input id="name" placeholder="Full name" required />
    <input id="email" type="email" placeholder="Email" required />
    <input id="password" type="password" placeholder="Password" required />
    <button type="submit">Register</button>
  </form>

<script>
const API = 'http://localhost:3006/users';
const msg = document.getElementById('msg');
function showMessage(text, cls){
  msg.textContent = text;
  msg.className = cls || '';
  if(cls) setTimeout(()=>{ msg.textContent=''; msg.className=''; }, 4000);
}

document.getElementById('regForm').addEventListener('submit', function(e){
  e.preventDefault();
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim().toLowerCase();
  const password = document.getElementById('password').value;

  if(!name || !email || !password) return;

  // 1. Check duplicate
  axios.get(API + '?email=' + encodeURIComponent(email))
    .then(res => {
      if(res.data && res.data.length){
        showMessage('Email already registered.', 'error');
        return Promise.reject('duplicate');
      }
      // simple "hash" simulation (don't store plaintext in real apps)
      const hashed = 'hashed_' + btoa(password).slice(0, 12);
      return axios.post(API, { name, email, password: hashed });
    })
    .then(postRes => {
      showMessage('Registered successfully!', 'success');
      document.getElementById('regForm').reset();
    })
    .catch(err => {
      if(err === 'duplicate') return;
      showMessage('Registration failed. Try again.', 'error');
      console.error(err);
    });
});
</script>
</body>
</html>
