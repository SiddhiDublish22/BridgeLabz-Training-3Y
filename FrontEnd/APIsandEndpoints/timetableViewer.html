<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Q5 - Timetable Viewer (Fetch)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body{font-family:Arial,Helvetica,sans-serif; padding:20px; max-width:900px; margin:auto}
    .controls{display:flex; gap:12px; align-items:center}
    select{padding:8px}
    .list{margin-top:16px}
    .card{padding:12px; border:1px solid #eee; border-radius:6px; margin-bottom:8px}
    .empty{color:#666}
  </style>
</head>
<body>
  <h2>College Timetable</h2>
  <div class="controls">
    <label>Day:
      <select id="day">
        <option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option>
      </select>
    </label>
    <div id="status" style="margin-left:auto"></div>
  </div>

  <div id="list" class="list"></div>

<script>
const API = 'http://localhost:3005/timetable';

function render(items){
  const container = document.getElementById('list');
  container.innerHTML = '';
  if(!items || !items.length){
    container.innerHTML = '<div class="empty">No classes today.</div>';
    return;
  }
  items.forEach(it => {
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `<div style="font-weight:700">${it.subject}</div>
                     <div>${it.faculty}</div>
                     <div style="color:#555">${it.time}</div>`;
    container.appendChild(div);
  });
}

function fetchForDay(day){
  document.getElementById('status').textContent = 'Loading...';
  fetch(API + '?day=' + encodeURIComponent(day))
    .then(r => { if(!r.ok) throw new Error('network'); return r.json(); })
    .then(data => render(data))
    .catch(() => document.getElementById('list').innerHTML = '<div class="empty">Error loading timetable</div>')
    .finally(()=> document.getElementById('status').textContent = '');
}

document.getElementById('day').addEventListener('change', function(){
  fetchForDay(this.value);
});

// initial
fetchForDay(document.getElementById('day').value);
</script>
</body>
</html>
