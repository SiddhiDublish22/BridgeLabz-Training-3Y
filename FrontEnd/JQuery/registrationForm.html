<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Q10 Validation</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

<form id="regForm">
    <input type="text" id="name" placeholder="Name"><br>
    <input type="email" id="email" placeholder="Email"><br>
    <input type="password" id="pass" placeholder="Password"><br>
    <button type="submit">Register</button>
</form>

<p id="msg"></p>

<script>
$("#regForm").submit(function (e) {
    e.preventDefault();

    let name = $("#name").val();
    let email = $("#email").val();
    let pass = $("#pass").val();

    let valid = true;

    if (!name) {
        $("#name").css("border", "2px solid red");
        valid = false;
    }

    if (!email.includes("@")) {
        $("#email").css("border", "2px solid red");
        valid = false;
    }

    if (pass.length < 8) {
        $("#pass").css("border", "2px solid red");
        valid = false;
    }

    if (valid) $("#msg").text("Registration Successful!");
    else $("#msg").text("Please fix errors!");
});
</script>

</body>
</html>
