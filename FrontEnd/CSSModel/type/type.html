<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typography</title>
    <link rel="stylesheet" href="type.css">
</head>
<body>

<main class="article">
    <h1>Typography Demonstration</h1>

    <p>
        <mark>This is highlighted text</mark>. 
        Typography involves <strong>font weight</strong>,
        <em>style</em>, spacing, alignment and more.
    </p>

    <p class="styled">
        Lorem ipsum dolor sit amet, consectetur adipiscing elit. Praesent
        consequat est <strong>imperdiet</strong> orci euismod, in 
        <em>pellentesque</em> turpis interdum.
    </p>
</main>

</body>
</html>
