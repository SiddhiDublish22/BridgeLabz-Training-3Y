<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Google Map Embed</title>
</head>
<body>
  <!-- loading="lazy" delays loading the map until it is visible to improve performance -->
  <iframe 
    src="https://www.google.com/maps?q=New+Delhi&output=embed"
    title="Map of New Delhi"
    width="80%" height="400" loading="lazy">
  </iframe>
</body>
</html>
