<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Travel Selection</title>
</head>
<body>
  <h1>Select Your Travel Preferences</h1>

  <!-- Country dropdown -->
  <label for="country">Country:</label>
  <select id="country">
    <option selected>India</option>
    <option>USA</option>
    <option>Japan</option>
  </select>
  <br><br>

  <!-- State dropdown -->
  <label for="state">State:</label>
  <select id="state">
    <option selected>Maharashtra</option>
    <option>California</option>
    <option>Tokyo</option>
  </select>
  <br><br>

  <!-- City dropdown -->
  <label for="city">City:</label>
  <select id="city">
    <option selected>Mumbai</option>
    <option>Los Angeles</option>
    <option>Shibuya</option>
  </select>
  <br><br>

  <!-- Favorite Tourist Place dropdown -->
  <label for="place">Favorite Tourist Place:</label>
  <select id="place">
    <option selected>Gateway of India</option>
    <option>Disneyland</option>
    <option>Tokyo Tower</option>
  </select>

  <p>Your choices reflect your love for travel and exploration!</p>
</body>
</html>
