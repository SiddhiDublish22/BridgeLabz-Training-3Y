<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Report</title>
</head>
<body>
  <!-- School name -->
  <h1 title="School Name">Sunshine High School</h1>

  <!-- Student Marks Table -->
  <table border="1" title="Student Marks Report">
    <caption>Report Card - Class 10</caption>
    <tr>
      <th rowspan="2">Subject</th>
      <th colspan="2">Marks</th>
    </tr>
    <tr>
      <th>Obtained</th>
      <th>Out of</th>
    </tr>
    <tr>
      <td>English</td>
      <td>85</td>
      <td>100</td>
    </tr>
    <tr>
      <td>Mathematics</td>
      <td>90</td>
      <td>100</td>
    </tr>
    <tr>
      <td>Science</td>
      <td>88</td>
      <td>100</td>
    </tr>
    <tr>
      <td>Social Studies</td>
      <td>80</td>
      <td>100</td>
    </tr>
    <tr>
      <td>Computer</td>
      <td>95</td>
      <td>100</td>
    </tr>
    <tr>
      <td colspan="3" title="Total Marks">Total: 438 / 500</td>
    </tr>
    <tr>
      <td colspan="3" title="Percentage">Percentage: 87.6%</td>
    </tr>
  </table>
</body>
</html>
